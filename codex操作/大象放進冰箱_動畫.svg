<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">如何把大象放進冰箱——SVG 動畫</title>
  <desc id="desc">循環播放三個步驟：打開冰箱、大象走進冰箱、關上冰箱。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#fff8dc"/>
    </linearGradient>
    <linearGradient id="fridgeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#bdc9d8"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7e8ff"/>
      <stop offset="1" stop-color="#4f6f88"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#24435a" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fridgeClip">
      <rect x="785" y="185" width="290" height="360" rx="22"/>
    </clipPath>

    <style><![CDATA[
      :root { --cycle: 12s; }
      * { transform-box: fill-box; }
      .loop { animation-iteration-count: infinite; animation-duration: var(--cycle); animation-timing-function: ease-in-out; }

      /* 冰箱門：先打開，最後關上 */
      #door {
        transform-origin: 100% 50%;
        animation-name: doorMotion;
      }
      @keyframes doorMotion {
        0%, 9%   { transform: scaleX(1) skewY(0deg); }
        22%, 69% { transform: scaleX(0.16) skewY(3deg); }
        82%,100% { transform: scaleX(1) skewY(0deg); }
      }

      /* 大象走路、縮小並進入冰箱 */
      #elephant {
        transform-origin: 50% 100%;
        animation-name: elephantMove;
      }
      @keyframes elephantMove {
        0%, 23%  { transform: translate(0,0) scale(1); opacity: 1; }
        31%      { transform: translate(55px,-5px) scale(1) rotate(-2deg); }
        39%      { transform: translate(120px,0) scale(0.96) rotate(2deg); }
        47%      { transform: translate(190px,-6px) scale(0.90) rotate(-2deg); }
        55%      { transform: translate(270px,0) scale(0.80) rotate(2deg); }
        63%      { transform: translate(360px,-4px) scale(0.66); opacity: 1; }
        69%      { transform: translate(430px,-10px) scale(0.48); opacity: 0; }
        70%,100% { transform: translate(430px,-10px) scale(0.48); opacity: 0; }
      }

      #leg1 { animation-name: legWalk1; transform-origin: 50% 0%; }
      #leg2 { animation-name: legWalk2; transform-origin: 50% 0%; }
      #leg3 { animation-name: legWalk2; transform-origin: 50% 0%; }
      #leg4 { animation-name: legWalk1; transform-origin: 50% 0%; }
      @keyframes legWalk1 {
        0%,24%,70%,100% { transform: rotate(0deg); }
        29%,39%,49%,59% { transform: rotate(11deg); }
        34%,44%,54%,64% { transform: rotate(-11deg); }
      }
      @keyframes legWalk2 {
        0%,24%,70%,100% { transform: rotate(0deg); }
        29%,39%,49%,59% { transform: rotate(-11deg); }
        34%,44%,54%,64% { transform: rotate(11deg); }
      }

      #trunk {
        transform-origin: 15% 10%;
        animation-name: trunkSwing;
      }
      @keyframes trunkSwing {
        0%,22%,70%,100% { transform: rotate(0deg); }
        30%,46%,62% { transform: rotate(7deg); }
        38%,54% { transform: rotate(-7deg); }
      }

      #ear {
        transform-origin: 30% 50%;
        animation-name: earFlap;
      }
      @keyframes earFlap {
        0%,24%,70%,100% { transform: scaleX(1); }
        34%,50%,66% { transform: scaleX(0.82); }
        42%,58% { transform: scaleX(1.08); }
      }

      #insideElephant {
        animation-name: insideShow;
      }
      @keyframes insideShow {
        0%,64% { opacity:0; transform: scale(0.8); }
        69%,78% { opacity:1; transform: scale(1); }
        82%,100% { opacity:0; transform: scale(0.8); }
      }

      .step { opacity:0; }
      #step1 { animation-name: step1; }
      #step2 { animation-name: step2; }
      #step3 { animation-name: step3; }
      #done  { animation-name: done; }
      @keyframes step1 { 0%,7%{opacity:0} 10%,24%{opacity:1} 28%,100%{opacity:0} }
      @keyframes step2 { 0%,27%{opacity:0} 31%,67%{opacity:1} 71%,100%{opacity:0} }
      @keyframes step3 { 0%,69%{opacity:0} 73%,86%{opacity:1} 90%,100%{opacity:0} }
      @keyframes done  { 0%,86%{opacity:0;transform:scale(.9)} 90%,97%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.9)} }

      #arrow { animation-name: arrowPulse; }
      @keyframes arrowPulse {
        0%,26%,70%,100% { opacity:0; transform:translateX(0); }
        31%,64% { opacity:1; transform:translateX(12px); }
        36%,59% { transform:translateX(0); }
      }

      #sparkles { animation-name: sparkle; }
      @keyframes sparkle {
        0%,84% { opacity:0; transform:scale(.8) rotate(0deg); }
        90%,97% { opacity:1; transform:scale(1.1) rotate(20deg); }
        100% { opacity:0; transform:scale(.8) rotate(35deg); }
      }

      .caption {
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-weight: 800;
        text-anchor: middle;
        fill: #19354a;
      }
      .small {
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        text-anchor: middle;
        fill: #496579;
      }
    ]]></style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="56" fill="#fff4ad" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M0 540 Q210 500 420 540 T840 540 T1200 540 V675 H0Z" fill="#a9d98d"/>
  <path d="M0 585 Q220 550 440 585 T880 585 T1200 585 V675 H0Z" fill="#77bd72" opacity="0.8"/>

  <!-- 標題 -->
  <text x="600" y="72" font-size="42" class="caption">如何把大象放進冰箱？</text>
  <text x="600" y="108" font-size="21" class="small">三個步驟，動畫示範</text>

  <!-- 冰箱本體 -->
  <g filter="url(#shadow)">
    <rect x="760" y="160" width="340" height="420" rx="28" fill="url(#fridgeBody)" stroke="#7e91a4" stroke-width="8"/>
    <rect x="785" y="185" width="290" height="360" rx="22" fill="url(#inside)"/>
    <rect x="805" y="230" width="250" height="12" rx="6" fill="#d7f4ff" opacity="0.7"/>
    <rect x="805" y="360" width="250" height="12" rx="6" fill="#d7f4ff" opacity="0.7"/>
    <rect x="820" y="495" width="220" height="24" rx="12" fill="#263e51" opacity="0.5"/>

    <!-- 冰箱裡的小象剪影 -->
    <g id="insideElephant" class="loop" clip-path="url(#fridgeClip)" transform-origin="930px 400px">
      <ellipse cx="935" cy="430" rx="78" ry="52" fill="#9bb1c1"/>
      <circle cx="990" cy="405" r="42" fill="#9bb1c1"/>
      <path d="M1010 420 C1045 435 1044 474 1015 485" fill="none" stroke="#9bb1c1" stroke-width="18" stroke-linecap="round"/>
      <circle cx="1004" cy="394" r="5" fill="#1b2c38"/>
    </g>
  </g>

  <!-- 冰箱門，繞右側轉動 -->
  <g id="door" class="loop" filter="url(#shadow)">
    <rect x="760" y="160" width="340" height="420" rx="28" fill="#edf3f8" stroke="#718496" stroke-width="8"/>
    <line x1="760" y1="315" x2="1100" y2="315" stroke="#a7b3bf" stroke-width="6"/>
    <rect x="792" y="208" width="14" height="90" rx="7" fill="#75899d"/>
    <rect x="792" y="350" width="14" height="150" rx="7" fill="#75899d"/>
    <rect x="875" y="195" width="110" height="32" rx="16" fill="#c9d5df" opacity="0.7"/>
    <circle cx="930" cy="211" r="7" fill="#58c0d8"/>
  </g>

  <!-- 大象 -->
  <g transform="translate(220 258)">
  <g id="elephant" class="loop" filter="url(#shadow)">
    <!-- 身體 -->
    <ellipse cx="245" cy="177" rx="150" ry="112" fill="#8ea6b8"/>
    <ellipse cx="315" cy="148" rx="82" ry="78" fill="#9bb1c1"/>
    <!-- 耳朵 -->
    <ellipse id="ear" class="loop" cx="275" cy="144" rx="56" ry="70" fill="#7894a8"/>
    <!-- 頭與眼睛 -->
    <circle cx="349" cy="137" r="64" fill="#9bb1c1"/>
    <circle cx="367" cy="122" r="7" fill="#172b38"/>
    <circle cx="369" cy="120" r="2.5" fill="#ffffff"/>
    <!-- 象鼻 -->
    <path id="trunk" class="loop" d="M389 157 C440 170 448 237 415 270 C403 283 384 272 397 256 C419 228 411 197 383 189" fill="none" stroke="#9bb1c1" stroke-width="30" stroke-linecap="round"/>
    <!-- 象牙 -->
    <path d="M387 165 Q421 180 407 207" fill="none" stroke="#fff7d6" stroke-width="10" stroke-linecap="round"/>
    <!-- 腿 -->
    <g id="leg1" class="loop"><rect x="135" y="235" width="42" height="104" rx="20" fill="#8199aa"/><ellipse cx="156" cy="337" rx="25" ry="12" fill="#6f8799"/></g>
    <g id="leg2" class="loop"><rect x="205" y="245" width="42" height="98" rx="20" fill="#9bb1c1"/><ellipse cx="226" cy="341" rx="25" ry="12" fill="#7c94a6"/></g>
    <g id="leg3" class="loop"><rect x="285" y="238" width="42" height="104" rx="20" fill="#8199aa"/><ellipse cx="306" cy="340" rx="25" ry="12" fill="#6f8799"/></g>
    <g id="leg4" class="loop"><rect x="345" y="232" width="42" height="108" rx="20" fill="#9bb1c1"/><ellipse cx="366" cy="338" rx="25" ry="12" fill="#7c94a6"/></g>
    <!-- 尾巴 -->
    <path d="M104 168 Q64 181 82 222" fill="none" stroke="#7c94a6" stroke-width="10" stroke-linecap="round"/>
    <path d="M80 220 l-12 18 M82 220 l4 20 M83 220 l17 13" stroke="#485f70" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>

  <!-- 方向箭頭 -->
  <g transform="translate(625 350)">
  <g id="arrow" class="loop">
    <path d="M0 0 H110" stroke="#ff8b3d" stroke-width="18" stroke-linecap="round"/>
    <path d="M90 -28 L126 0 L90 28" fill="none" stroke="#ff8b3d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>

  <!-- 步驟字幕 -->
  <g class="step loop" id="step1">
    <rect x="315" y="565" width="570" height="70" rx="35" fill="#ffffff" opacity="0.92"/>
    <text x="600" y="610" font-size="31" class="caption">步驟 1：打開冰箱門</text>
  </g>
  <g class="step loop" id="step2">
    <rect x="300" y="565" width="600" height="70" rx="35" fill="#ffffff" opacity="0.92"/>
    <text x="600" y="610" font-size="31" class="caption">步驟 2：把大象放進去</text>
  </g>
  <g class="step loop" id="step3">
    <rect x="315" y="565" width="570" height="70" rx="35" fill="#ffffff" opacity="0.92"/>
    <text x="600" y="610" font-size="31" class="caption">步驟 3：關上冰箱門</text>
  </g>

  <!-- 完成提示 -->
  <g id="done" class="loop" transform-origin="600px 350px">
    <rect x="370" y="285" width="460" height="130" rx="35" fill="#fffdf1" stroke="#ffbf3f" stroke-width="8" filter="url(#shadow)"/>
    <text x="600" y="345" font-size="42" class="caption">完成！</text>
    <text x="600" y="385" font-size="23" class="small">答案就是：開門、放進去、關門。</text>
  </g>

  <!-- 星星 -->
  <g id="sparkles" class="loop" transform-origin="600px 350px" fill="#ffbf3f">
    <path d="M325 260 l9 23 23 9-23 9-9 23-9-23-23-9 23-9z"/>
    <path d="M880 250 l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M920 470 l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
    <path d="M300 455 l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
  </g>
</svg>
